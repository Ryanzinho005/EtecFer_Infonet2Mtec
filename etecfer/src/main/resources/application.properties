spring.application.name=etecfer

#Configurações do banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/etecfer_db
spring.datasource.username=postgres
spring.datasource.password=postdba

# Atuailizar as tabelas do banco de dados automáticamente
spring.jpa.hibernate.ddl-auto=update


# não formatar os comandos SQL no console
spring.jpa.properties.hibernate.format_sql=false


# mostrar os comandos SQL no console
spring.jpa.show-sql=true


# configurar a porta de servidor
server.port=8080
