<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de disciplinas</title>
</head>
<body>
    <h1 style="text-align: center;">Matricular Disciplina</h1>

    <form th:action="@{/disciplinas/salvar}" method="post" th:object="${disciplina}">
    <input type="hidden" th:field="*{idDisciplina}" />

     <label>Nome:</label>
    <input type="text" th:field="*{nomeDisciplina}" />
    <br />

    <label>Sigla:</label>
    <input type="text" th:field="*{siglaDisciplina}" />
    <br />

    <label>Carga Horária:</label>
    <input type="text" th:field="*{chDisciplina}" />
    <br /> 

    <label for="idCurso">Curso:</label>
    <select th:field="*{curso}">
        <option value="" disabled selected>Selecione um curso</option>
        <option th:each="curso : ${cursos}"
                th:text="${curso.nomeCurso}"
                th:value="${curso.idCurso}"></option>
    </select>
    <br/>

    <label for="idProfessor">Professor:</label>
    <select th:field="*{professor}">
        <option value="" disabled selected>Selecione um Professor</option>
        <option th:each="curso : ${professores}"
                th:text="${curso.nomeProfessor}"
                th:value="${curso.idProfessor}"></option>
    </select>
    <br>

    <input type="submit" value="Salvar">
</form>  
</body>
</html>
