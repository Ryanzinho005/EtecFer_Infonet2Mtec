<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Alunos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #333;
        }

        /* Menu */
        .menu {
            background: linear-gradient(135deg, #41c3ff, #41c3ff);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .menu .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu ul {
            list-style: none;
            display: flex;
            gap: 10px;
        }

        .menu ul li a {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .menu ul li a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Conteúdo */
        .conteudo {
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #41c3ff;
            margin-bottom: 25px;
        }

        .tabela {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .tabela th {
            background-color: #41c3ff;
            color: white;
            padding: 14px;
        }

        .tabela td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .tabela tr:hover {
            background-color: #eef6ff;
        }

        .editar {
            color: #41c3ff;
            text-decoration: none;
            font-weight: bold;
            margin-right: 10px;
        }

        .excluir {
            color: #d32f2f;
            text-decoration: none;
            font-weight: bold;
        }

        .editar:hover,
        .excluir:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- MENU -->
    <nav class="menu">
        <div class="logo">
            Sistema de Alunos
        </div>

        <ul>
            <li>
                <a href="/alunos">Lista de Alunos</a>
            </li>
            <li>
                <a href="/alunos/criar">Novo Aluno</a>
            </li>
        </ul>
    </nav>

    <!-- CONTEÚDO -->
    <div class="conteudo">

        <h1>Lista de Alunos</h1>

        <table class="tabela">
            <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>RA</th>
                <th>CPF</th>
                <th>Curso</th>
                
                <th colspan="2">Ações</th>
            </tr>

            <tr th:each="aluno : ${alunos}">
                <td th:text="${aluno.nomeAluno}"></td>
                <td th:text="${aluno.emailAluno}"></td>
                <td th:text="${aluno.telefoneAluno}"></td>
                <td th:text="${aluno.raAluno}"></td>
                <td th:text="${aluno.cpfAluno}"></td>
                <td th:text="${aluno.curso.nomeCurso}"></td>

                <td>
                    <a class="editar"
                       th:href="@{/alunos/editar/{id}(id=${aluno.idAluno})}">
                        Editar
                    </a>

                    <a class="excluir"
                       th:href="@{/alunos/excluir/{id}(id=${aluno.idAluno})}">
                        Excluir
                    </a>
                </td>
            </tr>
        </table>

    </div>

</body>
</html>
